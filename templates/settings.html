{% extends "base.html" %}
{% block content %}
<h1>Settings</h1>
<form method="post" class="card">{% csrf_token %}
  {% for f in form %}<label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}<div class="muted">{{ f.help_text }}</div>{{ f.errors }}{% endfor %}
  <p><button>Save</button></p>
</form>
{% endblock %}
